# CCGS project configuration — single source of truth for project settings.
# Schema: grep the `## <key>` section of .claude/docs/effects-map.md —
# it is ~31k tokens whole, ~900 per section. Do not open it entire.

schema_version: 1

framework:
  version: 1.1.0
  last_upgraded: 2026-10-07

project:
  stage: Pre-Production

modes:
  rigor: standard
  automation: autonomous

engine:
  name: "Godot"
  version: "4.6.2"
  language: "GDScript"
  rendering: "Forward+"
  physics: "Godot Physics 2D"
  path: "D:/Programs/Godot_v4.6.2-stable_win64.exe (1)/Godot_v4.6.2-stable_win64.exe"

specialists:
  code: "godot-gdscript-specialist"
  shader: "godot-shader-specialist"
  ui: "godot-specialist"
  additional: ["godot-gdextension-specialist"]

naming:
  classes: PascalCase
  variables: snake_case
  constants: SCREAMING_SNAKE
  signals: past_tense
  files: snake_case
  scenes: snake_case

commands:
  build: "pwsh -NoProfile -ExecutionPolicy Bypass -File tools/package_windows.ps1"
  test: "pwsh -NoProfile -ExecutionPolicy Bypass -File tools/run_tests.ps1"
  run: "pwsh -NoProfile -ExecutionPolicy Bypass -File tools/run_project.ps1"
  smoke: "godot --headless --path . --quit-after 5"
